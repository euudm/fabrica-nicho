<style>
:root{
  --accent:#F2A900; --accent-ink:#16181D;
  --dark:#16181D; --dark-2:#1F2229; --dark-3:#2A2E37;
  --ink:#16181D; --muted:#5E6470; --line:#E6E3DC;
  --paper:#F7F5F0; --white:#fff;
  --r:18px; --r-sm:12px;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --wrap:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--sans);color:var(--ink);background:var(--white);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 20px}
em{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--accent);letter-spacing:-.01em}
.sec{padding:72px 0}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.kicker::before{content:"";width:22px;height:2px;background:var(--accent)}
.h2{font-size:clamp(1.9rem,5.2vw,3rem);line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:18ch}
.lead{color:var(--muted);font-size:1.05rem;max-width:56ch;margin-top:14px}
.head-row{display:flex;flex-direction:column;gap:6px;margin-bottom:40px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1rem;transition:transform .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn svg{width:20px;height:20px;flex:none}
.btn-accent{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 30px -10px var(--accent)}
.btn-accent:hover{transform:translateY(-2px)}
.btn-wa{background:#25D366;color:#0b2914}
.btn-wa:hover{transform:translateY(-2px)}
.btn-ghost{border:1.5px solid rgba(255,255,255,.22);color:#fff}
.btn-ghost:hover{border-color:#fff}
.btn-dark{background:var(--dark);color:#fff}
.btn-sm{height:42px;padding:0 16px;font-size:.92rem}

/* 1. topo */
.topbar{background:#0E1013;color:#C9CCD3;font-size:.82rem}
.topbar .wrap{display:flex;justify-content:center;gap:8px 22px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;text-align:center}
.topbar b{color:var(--accent)}
.topbar .cid{display:none;opacity:.75}

/* 2. header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(22,24,29,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{color:#fff;font-size:1.22rem;letter-spacing:-.02em;line-height:1}
.logo b{font-weight:800}
.logo span{font-weight:400;color:#AEB3BD;margin-left:4px}
.nav{display:none;gap:26px;color:#C9CCD3;font-size:.94rem;font-weight:500}
.nav a:hover{color:#fff}
.hdr-ctas{display:flex;gap:8px;align-items:center}
.hdr-ctas .btn-ghost{display:none}
.burger{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;border:1.5px solid rgba(255,255,255,.16)}
.burger svg{width:20px;height:20px}
.mnav{display:none;background:var(--dark);border-top:1px solid rgba(255,255,255,.06);padding:12px 20px 22px}
.mnav.open{display:block}
.mnav a{display:block;color:#E3E5EA;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);font-weight:500}
.mnav .btn{width:100%;margin-top:16px}

/* 3. hero */
.hero{background:var(--dark);color:#fff;position:relative;overflow:hidden;padding:44px 0 64px}
.hero::before{content:"";position:absolute;inset:-30% -20% auto auto;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent);pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:40px}
.selo{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:.85rem;font-weight:600;color:#E3E5EA}
.selo i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.hero h1{font-size:clamp(2.4rem,9vw,4.4rem);line-height:1.02;font-weight:800;letter-spacing:-.04em;margin:20px 0 18px;max-width:14ch}
.hero p.sub{color:#B9BEC8;font-size:1.08rem;max-width:52ch}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-ctas .btn{flex:1 1 200px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;padding-top:26px;border-top:1px solid rgba(255,255,255,.08)}
.stats b{display:block;font-size:clamp(1.15rem,4.4vw,1.6rem);font-weight:800;letter-spacing:-.02em;color:#fff}
.stats span{font-size:.8rem;color:#9AA0AB}
.hero-media{position:relative}
.hero-media .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/4.3;background:var(--dark-3)}
.hero-media .ph img{width:100%;height:100%;object-fit:cover}
.gcard{position:absolute;left:-6px;bottom:-22px;background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;box-shadow:0 24px 50px -18px rgba(0,0,0,.6);display:flex;gap:14px;align-items:center;max-width:300px}
.gcard .g{width:38px;height:38px;border-radius:50%;background:#F1F3F4;display:grid;place-items:center;flex:none}
.gcard .g svg{width:20px;height:20px}
.stars{color:#FBBC04;letter-spacing:2px;font-size:.95rem;line-height:1}
.gcard small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.gcard strong{font-size:1rem}
.xcard{position:absolute;right:-6px;top:22px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.xcard b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.xcard span{font-size:.78rem;font-weight:600;opacity:.85}
.tag-ex{display:inline-block;margin-top:6px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#FFE9A8;color:#6B4E00;border-radius:6px;padding:3px 6px}

/* 4. marquee */
.marq{background:var(--accent);color:var(--accent-ink);overflow:hidden;padding:16px 0;border-top:1px solid rgba(0,0,0,.08)}
.marq-track{display:flex;width:max-content;animation:marq 32s linear infinite}
.marq-track span{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;padding:0 22px;display:flex;align-items:center;gap:44px;white-space:nowrap}
.marq-track span::after{content:"✦";font-size:.8rem;opacity:.6}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* 5. serviços */
.servicos{background:var(--paper)}
.grid-s{display:grid;gap:18px}
.card-s{background:#fff;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card-s:hover{transform:translateY(-4px);box-shadow:0 22px 40px -24px rgba(22,24,29,.35)}
.card-s .im{aspect-ratio:16/10;overflow:hidden;background:var(--line)}
.card-s .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card-s:hover .im img{transform:scale(1.05)}
.card-s .bd{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-s h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.card-s h3 small{display:block;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px}
.card-s p{color:var(--muted);font-size:.96rem;flex:1}
.card-s .lnk{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#128C4A;margin-top:6px}
.card-s .lnk svg{width:18px;height:18px}
.card-wide .bd{padding:28px}
.card-wide h3{font-size:1.5rem}

/* 6. como funciona */
.passos{display:grid;gap:16px;counter-reset:p}
.passo{position:relative;padding:28px 24px 26px;border-radius:var(--r);border:1px solid var(--line);background:#fff}
.passo .n{width:46px;height:46px;border-radius:14px;background:var(--dark);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:1.1rem;margin-bottom:18px}
.passo h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.passo p{color:var(--muted)}

/* 7. por que */
.porque{background:var(--dark);color:#fff}
.porque .lead{color:#AEB3BD}
.porque .kicker{color:#AEB3BD}
.pq-grid{display:grid;gap:40px;align-items:center}
.difs{display:grid;gap:14px;margin-top:30px}
.dif{display:flex;gap:16px;padding:18px;border-radius:var(--r-sm);background:var(--dark-2);border:1px solid rgba(255,255,255,.06)}
.dif .ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.dif .ic svg{width:22px;height:22px}
.dif h3{font-size:1.04rem;font-weight:700;margin-bottom:3px}
.dif p{color:#9AA0AB;font-size:.93rem}
.pq-media{position:relative}
.pq-media .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/3.4;background:var(--dark-3)}
.pq-media .ph img{width:100%;height:100%;object-fit:cover}
.counter{position:absolute;left:18px;bottom:18px;background:#fff;color:var(--ink);border-radius:16px;padding:16px 20px}
.counter b{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.counter span{font-size:.85rem;color:var(--muted);font-weight:600}
.porque .btn{margin-top:28px}

/* 8. regiões */
.reg-grid{display:grid;gap:30px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:.94rem}
.chip svg{width:15px;height:15px;color:var(--accent)}
.map{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-height:320px;background:var(--paper)}
.map iframe{width:100%;height:100%;min-height:320px;border:0;display:block}

/* 9. depoimentos */
.depo{background:var(--paper)}
.deps{display:grid;gap:16px}
.dep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:16px}
.dep p{font-size:1.02rem;flex:1}
.dep .who{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--dark);color:var(--accent);display:grid;place-items:center;font-weight:800}
.who b{display:block;font-size:.96rem}
.who small{color:var(--muted);font-size:.82rem}
.dep-sum{margin-top:26px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted)}
.dep-sum strong{color:var(--ink)}
.aviso-ex{margin-top:14px;display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#FFE9A8;color:#6B4E00;border-radius:8px;padding:6px 10px}

/* 10. cta final */
.ctaf{background:var(--accent);color:var(--accent-ink);text-align:center;position:relative;overflow:hidden}
.ctaf .wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.ctaf .selo{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.1);color:inherit}
.ctaf .selo i{background:var(--accent-ink);box-shadow:none}
.ctaf h2{font-size:clamp(2rem,7vw,3.6rem);line-height:1.04;font-weight:800;letter-spacing:-.04em;margin:20px 0 14px;max-width:16ch}

.ctaf .row .btn{flex:0 1 260px}
.ctaf .tel{margin-top:16px;font-weight:700;opacity:.8}

/* 11. faq */
.faq-grid{display:grid;gap:30px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-weight:700;font-size:1.08rem;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .25s,background .25s}
.faq summary .pm svg{width:14px;height:14px}
.faq details[open] .pm{transform:rotate(45deg);background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.faq .ans{color:var(--muted);padding:0 50px 22px 0}

/* 12. footer */
.ftr{background:#0E1013;color:#AEB3BD;padding:60px 0 100px;font-size:.94rem}
.ftr-grid{display:grid;gap:34px}
.ftr .logo{font-size:1.3rem}
.ftr h4{color:#fff;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.ftr ul{list-style:none;display:grid;gap:9px}
.ftr a:hover{color:#fff}
.ftr .hr{display:flex;justify-content:space-between;gap:12px}
.ftr .hr span:last-child{color:#fff;font-weight:600}
.ftr .bot{margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:.84rem}

.fab{position:fixed;right:18px;bottom:18px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -8px rgba(37,211,102,.7)}
.fab svg{width:30px;height:30px}
.fab::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ping 2.4s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.marq-track,.fab::before{animation:none}}

/* ---------- breakpoints ---------- */
@media (min-width:640px){
  .topbar .cid{display:inline}
  .grid-s{grid-template-columns:repeat(2,1fr)}
  .card-wide{grid-column:1/-1}
  .difs{grid-template-columns:repeat(2,1fr)}
  .hero-ctas .btn{flex:0 0 auto}
  .gcard{left:-18px}
  .xcard{right:-18px}
}
@media (min-width:900px){
  .sec{padding:104px 0}
  .head-row{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:40px}
  .head-row .lead{margin-top:0;max-width:40ch}
  .nav{display:flex}
  .burger{display:none}
  .hdr-ctas .btn-ghost{display:inline-flex}
  .hero{padding:72px 0 104px}
  .hero .wrap{grid-template-columns:1.1fr .9fr;align-items:center;gap:60px}
  .grid-s{grid-template-columns:repeat(3,1fr)}
  .card-wide{display:grid;grid-template-columns:1.2fr 1fr}
  .card-wide .im{aspect-ratio:auto;min-height:320px}
  .card-wide .bd{justify-content:center;padding:44px}
  .passos{grid-template-columns:repeat(3,1fr)}
  .pq-grid{grid-template-columns:1fr 1fr;gap:64px}
  .reg-grid{grid-template-columns:1fr 1.1fr;align-items:stretch;gap:50px}
  .deps{grid-template-columns:repeat(3,1fr)}
  .faq-grid{grid-template-columns:.8fr 1.2fr;gap:60px}
  .ftr-grid{grid-template-columns:1.4fr 1fr 1fr 1.2fr}
  .ftr{padding-bottom:60px}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap" id="topbar"></div></div>

<header class="hdr">
  <div class="wrap">
    <a href="#topo" class="logo" id="logo"></a>
    <nav class="nav" id="nav"></nav>
    <div class="hdr-ctas">
      <a class="btn btn-wa btn-sm js-wa" target="_blank" rel="noopener"><svg data-i="wa"></svg><span>WhatsApp</span></a>
      <a class="btn btn-ghost btn-sm js-tel"><svg data-i="tel"></svg><span>Ligar</span></a>
      <button class="burger" id="burger" aria-label="Abrir menu"><svg data-i="menu"></svg></button>
    </div>
  </div>
  <div class="mnav" id="mnav"></div>
</header>

<main id="topo">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="selo"><i></i><span id="h-selo"></span></span>
        <h1 id="h-titulo"></h1>
        <p class="sub" id="h-sub"></p>
        <div class="hero-ctas">
          <a class="btn btn-accent js-wa" target="_blank" rel="noopener"><svg data-i="wa"></svg><span id="h-cta1"></span></a>
          <a class="btn btn-ghost js-tel"><svg data-i="tel"></svg><span id="h-cta2"></span></a>
        </div>
        <div class="stats" id="h-stats"></div>
      </div>
      <div class="hero-media">
        <div class="ph"><img id="h-img" alt="" fetchpriority="high"></div>
        <div class="xcard" id="h-extra"></div>
        <div class="gcard" id="h-nota"></div>
      </div>
    </div>
  </section>

  <div class="marq" aria-hidden="true"><div class="marq-track" id="marq"></div></div>

  <section class="sec servicos" id="servicos">
    <div class="wrap">
      <div class="head-row rv">
        <div><span class="kicker" data-t="kServicos"></span><h2 class="h2" id="s-titulo"></h2></div>
        <p class="lead" id="s-intro"></p>
      </div>
      <div class="grid-s" id="s-grid"></div>
    </div>
  </section>

  <section class="sec" id="como-funciona">
    <div class="wrap">
      <div class="head-row rv"><div><span class="kicker" data-t="kPassos"></span><h2 class="h2" id="p-titulo"></h2></div></div>
      <div class="passos" id="p-grid"></div>
    </div>
  </section>

  <section class="sec porque" id="porque">
    <div class="wrap pq-grid">
      <div class="rv">
        <span class="kicker" id="pq-kicker"></span>
        <h2 class="h2" id="pq-titulo"></h2>
        <p class="lead" id="pq-intro"></p>
        <div class="difs" id="pq-difs"></div>
        <a class="btn btn-accent js-wa" target="_blank" rel="noopener"><svg data-i="wa"></svg><span data-t="botaoPorque"></span></a>
      </div>
      <div class="pq-media rv">
        <div class="ph"><img id="pq-img" alt="" loading="lazy"></div>
        <div class="counter" id="pq-counter"></div>
      </div>
    </div>
  </section>

  <section class="sec" id="regioes">
    <div class="wrap reg-grid">
      <div class="rv">
        <span class="kicker" data-t="kRegioes"></span>
        <h2 class="h2" id="r-titulo"></h2>
        <p class="lead" id="r-intro"></p>
        <div class="chips" id="r-chips"></div>
      </div>
      <div class="map rv" id="r-map"></div>
    </div>
  </section>

  <section class="sec depo" id="depoimentos">
    <div class="wrap">
      <div class="head-row rv"><div><span class="kicker" data-t="kDepoimentos"></span><h2 class="h2" id="d-titulo"></h2></div></div>
      <div class="deps" id="d-grid"></div>
      <div class="dep-sum" id="d-sum"></div>
    </div>
  </section>

  <section class="sec ctaf" id="contato">
    <div class="wrap rv">
      <span class="selo"><i></i><span id="c-selo"></span></span>
      <h2 id="c-titulo"></h2>
      <p id="c-texto"></p>
      <div class="row">
        <a class="btn btn-dark js-wa" target="_blank" rel="noopener"><svg data-i="wa"></svg><span data-t="botaoWhatsApp"></span></a>
        <a class="btn btn-dark js-tel" style="background:transparent;border:1.5px solid currentColor;color:inherit"><svg data-i="tel"></svg><span data-t="botaoLigar"></span></a>
      </div>
      <div class="tel" id="c-tel"></div>
    </div>
  </section>

  <section class="sec" id="duvidas">
    <div class="wrap faq-grid">
      <div class="rv"><span class="kicker" data-t="kFaq"></span><h2 class="h2" data-t="faqTitulo"></h2></div>
      <div class="faq rv" id="faq"></div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <div class="ftr-grid" id="ftr"></div>
    <div class="bot" id="ftr-bot"></div>
  </div>
</footer>

<a class="fab js-wa" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp"><svg data-i="wa"></svg></a>

<script>
(function(){
  const C = CONFIG, $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rich = s => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");
  const num = s => String(s || "").replace(/\D/g, "");

  /* links */
  const waNum = num(C.whatsapp);
  /* textos de interface: padrão abaixo, sobrescreve com CONFIG.textos */
  const T = Object.assign({
    mensagemWhatsApp: "Olá {nome}, gostaria de mais informações do serviço!",
    nav: [["#servicos","Serviços"],["#como-funciona","Como funciona"],["#regioes","Regiões"],["#depoimentos","Depoimentos"],["#duvidas","Dúvidas"]],
    kServicos: "Serviços", kPassos: "Simples assim", kPorque: "Por que {nome}", kRegioes: "Onde a gente atende",
    kDepoimentos: "Depoimentos", kFaq: "Dúvidas frequentes", faqTitulo: "Antes de chamar, *talvez ajude*",
    botaoCard: "Pedir orçamento", botaoPorque: "Falar com a gente", botaoWhatsApp: "Chamar no WhatsApp", botaoLigar: "Prefiro ligar",
    footerServicos: "Serviços", footerHorario: "Horário"
  }, C.textos || {});
  const tx = s => String(s).replace(/{nome}/g, C.nome);
  const waMsg = tx(T.mensagemWhatsApp);
  const WA = `https://wa.me/55${waNum}?text=${encodeURIComponent(waMsg)}`;
  const TEL = `tel:+55${num(C.telefone || C.whatsapp)}`;
  const fmtTel = n => { n = num(n); return n.length >= 10 ? `(${n.slice(0,2)}) ${n.slice(2, n.length-4)}-${n.slice(-4)}` : (C.telefone || C.whatsapp); };

  /* cor de destaque + contraste automático */
  const root = document.documentElement.style;
  root.setProperty("--accent", C.cor);
  const h = C.cor.replace("#",""), rgb = [0,2,4].map(i => parseInt(h.substr(i,2),16)/255).map(v => v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4));
  root.setProperty("--accent-ink", (.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]) > .36 ? "#16181D" : "#FFFFFF");

  /* ícones */
  const I = {
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4C2.7 15.6 2.2 13.8 2.2 12 2.2 6.6 6.6 2.2 12 2.2c2.6 0 5.1 1 6.9 2.9 1.8 1.8 2.9 4.3 2.9 6.9 0 5.4-4.4 9.8-9.8 9.8zM20.5 3.5C18.2 1.2 15.2 0 12 0 5.4 0 .1 5.3.1 11.9c0 2.1.5 4.2 1.6 6L0 24l6.3-1.6c1.8 1 3.8 1.5 5.7 1.5 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.4-8.5z"/></svg>',
    tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
    google:'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.2-2.1 3.5-5.1 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.8 3.6-4.9 6.7-4.9z"/></svg>',
    escudo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
    relogio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    etiqueta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>',
    pino:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    ferramenta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L2 10l8-8z"/></svg>',
    certificado:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg>',
    estrela:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
    casa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>'
  };
  const icon = (k, cls) => (I[k] || I.estrela);

  /* SEO dinâmico */
  document.title = C.seo.title;
  const setMeta = (sel, attr, val) => { let m = document.head.querySelector(sel); if (!m) { m = document.createElement("meta"); const [a, v] = attr; m.setAttribute(a, v); document.head.appendChild(m); } m.setAttribute("content", val); };
  setMeta('meta[name="description"]', ["name","description"], C.seo.description);
  setMeta('meta[property="og:title"]', ["property","og:title"], C.seo.title);
  setMeta('meta[property="og:description"]', ["property","og:description"], C.seo.description);
  setMeta('meta[property="og:image"]', ["property","og:image"], C.seo.ogImage);
  setMeta('meta[name="geo.region"]', ["name","geo.region"], "BR-" + C.uf);
  setMeta('meta[name="geo.placename"]', ["name","geo.placename"], C.cidade);
  const ld = document.createElement("script"); ld.type = "application/ld+json";
  ld.textContent = JSON.stringify({
    "@context":"https://schema.org","@type":"LocalBusiness",
    name: C.nome, description: C.seo.description, image: C.seo.ogImage,
    telephone: "+55" + num(C.telefone || C.whatsapp),
    address: {"@type":"PostalAddress", streetAddress: C.endereco, addressLocality: C.cidade, addressRegion: C.uf, addressCountry:"BR"},
    areaServed: C.cidades.map(c => ({"@type":"City", name: c})),
    openingHours: "Mo-Su", url: location.href.split("#")[0]
  });
  document.head.appendChild(ld);

  /* 1. topo */
  $("topbar").innerHTML = `<span><b>${esc(C.topo.destaque)}</b> ${esc(C.topo.texto)} · ${esc(C.horario.resumo)} · ${esc(C.horario.dias)}</span><span class="cid">${C.cidades.slice(0,4).map(esc).join(" · ")} e região</span>`;

  /* 2. header */
  const logoHTML = `<b>${esc(C.nome)}</b><span>${esc(C.complemento)}</span>`;
  $("logo").innerHTML = logoHTML;
  const links = T.nav;
  $("nav").innerHTML = links.map(([h,t]) => `<a href="${h}">${t}</a>`).join("");
  $("mnav").innerHTML = links.map(([h,t]) => `<a href="${h}">${t}</a>`).join("") + `<a class="btn btn-wa js-wa" target="_blank" rel="noopener">${I.wa}<span>${esc(T.botaoWhatsApp)}</span></a>`;
  $("burger").onclick = () => $("mnav").classList.toggle("open");
  $("mnav").addEventListener("click", e => { if (e.target.closest("a")) $("mnav").classList.remove("open"); });

  /* 3. hero */
  const H = C.hero;
  $("h-selo").textContent = H.selo;
  $("h-titulo").innerHTML = rich(H.titulo);
  $("h-sub").textContent = H.subtitulo;
  $("h-cta1").textContent = H.ctaPrincipal;
  $("h-cta2").textContent = H.ctaSecundario;
  $("h-stats").innerHTML = H.numeros.map(n => `<div><b>${esc(n.valor)}</b><span>${esc(n.rotulo)}</span></div>`).join("");
  $("h-img").src = H.imagem; $("h-img").alt = `${C.nicho} em ${C.cidade}`;
  $("h-extra").innerHTML = H.extra ? `<b>${esc(H.extra.valor)}</b><span>${esc(H.extra.rotulo)}</span>` : "";
  if (!H.extra) $("h-extra").remove();
  $("h-nota").innerHTML = `<div class="g">${I.google}</div><div><div class="stars">★★★★★</div><strong>${esc(H.nota.valor)} / 5,0</strong><small>${esc(H.nota.total)} avaliações no Google</small>${H.nota.exemplo ? '<span class="tag-ex">Exemplo: trocar pela nota real</span>' : ""}</div>`;

  /* 4. marquee */
  const nomes = [...C.servicos.map(s => s.titulo), C.servicoLargo && C.servicoLargo.titulo].filter(Boolean);
  const run = nomes.map(n => `<span>${esc(n)}</span>`).join("");
  $("marq").innerHTML = run + run + run + run;

  /* 5. serviços */
  $("s-titulo").innerHTML = rich(C.servicosTitulo);
  $("s-intro").textContent = C.servicosIntro;
  const card = (s, wide) => `<article class="card-s rv${wide ? " card-wide" : ""}">
      <div class="im"><img src="${esc(s.img)}" alt="${esc(s.titulo)} em ${esc(C.cidade)}" loading="lazy"></div>
      <div class="bd"><h3>${esc(s.titulo)} <small>em ${esc(C.cidade)}</small></h3><p>${esc(s.desc)}</p>
      <a class="lnk js-wa" target="_blank" rel="noopener">${I.wa}<span>${esc(T.botaoCard)}</span></a></div></article>`;
  $("s-grid").innerHTML = C.servicos.map(s => card(s)).join("") + (C.servicoLargo ? card(C.servicoLargo, true) : "");

  /* 6. passos */
  $("p-titulo").innerHTML = rich(C.passosTitulo);
  $("p-grid").innerHTML = C.passos.map((p, i) => `<div class="passo rv"><div class="n">${i+1}</div><h3>${esc(p.titulo)}</h3><p>${esc(p.desc)}</p></div>`).join("");

  /* 7. por que */
  const P = C.porque;
  $("pq-kicker").textContent = tx(T.kPorque);
  $("pq-titulo").innerHTML = rich(P.titulo);
  $("pq-intro").textContent = P.intro;
  $("pq-difs").innerHTML = P.itens.map(d => `<div class="dif"><div class="ic">${icon(d.icone)}</div><div><h3>${esc(d.titulo)}</h3><p>${esc(d.desc)}</p></div></div>`).join("");
  $("pq-img").src = P.imagem; $("pq-img").alt = `Equipe ${C.nome}`;
  $("pq-counter").innerHTML = `<b data-count="${P.contador.valor}" data-prefix="${esc(P.contador.prefixo || "")}">${esc(P.contador.prefixo || "")}0</b><span>${esc(P.contador.rotulo)}</span>`;

  /* 8. regiões */
  $("r-titulo").innerHTML = rich(C.regioesTitulo);
  $("r-intro").textContent = C.regioesIntro;
  $("r-chips").innerHTML = C.cidades.map(c => `<span class="chip">${I.pin}${esc(c)}</span>`).join("");
  const mapSrc = C.mapsEmbed || `https://www.google.com/maps?q=${encodeURIComponent(C.cidade + " " + C.uf)}&z=11&output=embed`;
  $("r-map").innerHTML = `<iframe src="${esc(mapSrc)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa da região atendida"></iframe>`;

  /* 9. depoimentos */
  const D = C.depoimentos;
  $("d-titulo").innerHTML = rich(D.titulo);
  $("d-grid").innerHTML = D.itens.map(d => `<div class="dep rv"><div class="stars">★★★★★</div><p>“${esc(d.texto)}”</p><div class="who"><div class="av">${esc(d.nome.trim()[0])}</div><div><b>${esc(d.nome)}</b><small>${esc(d.servico)} · via Google</small></div></div></div>`).join("");
  $("d-sum").innerHTML = `<span class="stars">★★★★★</span><span>Nota <strong>${esc(H.nota.valor)} de 5</strong> com <strong>${esc(H.nota.total)} avaliações</strong> no Google</span>` + (D.exemplo ? `<span class="aviso-ex">Exemplo: trocar pelas avaliações reais</span>` : "");

  /* 10. cta final */
  $("c-selo").textContent = C.ctaFinal.selo;
  $("c-titulo").innerHTML = rich(C.ctaFinal.titulo);
  $("c-texto").textContent = C.ctaFinal.texto;
  $("c-tel").textContent = fmtTel(C.telefone || C.whatsapp);

  /* 11. faq */
  $("faq").innerHTML = C.faq.map((f, i) => `<details${i === 0 ? " open" : ""}><summary>${esc(f.p)}<span class="pm">${I.plus}</span></summary><div class="ans">${esc(f.r)}</div></details>`).join("");
  $("faq").addEventListener("toggle", e => { if (e.target.open) $("faq").querySelectorAll("details").forEach(d => d !== e.target && (d.open = false)); }, true);

  /* 12. footer */
  $("ftr").innerHTML = `
    <div><div class="logo">${logoHTML}</div><p style="margin-top:14px;max-width:34ch">${esc(C.footerSobre)}</p></div>
    <div><h4>${esc(T.footerServicos)}</h4><ul>${nomes.map(n => `<li><a href="#servicos">${esc(n)}</a></li>`).join("")}</ul></div>
    <div><h4>${esc(T.footerHorario)}</h4><ul>${C.horario.lista.map(([d,h]) => `<li class="hr"><span>${esc(d)}</span><span>${esc(h)}</span></li>`).join("")}</ul></div>
    <div><h4>Contato</h4><ul>
      <li><a class="js-wa" target="_blank" rel="noopener">WhatsApp ${esc(fmtTel(C.whatsapp))}</a></li>
      <li><a class="js-tel">Telefone ${esc(fmtTel(C.telefone || C.whatsapp))}</a></li>
      <li>${esc(C.endereco)}<br>${esc(C.cidade)}, ${esc(C.uf)}</li>
      <li><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(C.endereco + ", " + C.cidade + " " + C.uf)}" target="_blank" rel="noopener">Ver no Google Maps</a></li>
    </ul></div>`;
  $("ftr-bot").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(C.nome)} · ${esc(C.nicho)} em ${esc(C.cidade)}</span><a class="js-wa" target="_blank" rel="noopener">${esc(T.botaoWhatsApp)}</a>`;

  /* textos data-t */
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = rich(tx(T[el.dataset.t])));

  /* ícones data-i + links */
  document.querySelectorAll("svg[data-i]").forEach(s => s.outerHTML = I[s.dataset.i]);
  document.querySelectorAll(".js-wa").forEach(a => a.href = WA);
  document.querySelectorAll(".js-tel").forEach(a => a.href = TEL);

  /* imagem quebrada = fundo neutro */
  document.querySelectorAll("img").forEach(img => img.addEventListener("error", () => { img.style.visibility = "hidden"; }));

  /* reveal + contador */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
    const c = e.target.querySelector("[data-count]");
    if (c) { const end = +c.dataset.count, pre = c.dataset.prefix, t0 = performance.now();
      const step = t => { const k = Math.min((t - t0) / 1600, 1); c.textContent = pre + Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString("pt-BR"); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step); }
  }), { threshold: .15 });
  document.querySelectorAll(".rv, .pq-media").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
